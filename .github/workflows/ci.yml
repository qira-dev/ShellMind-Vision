name: ShellMind Vision CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript & Shell Syntax
        shell: bash
        run: |
          node --check server.mjs
          node --check mcp-stdio.mjs
          node --check lib/bridge.mjs
          bash -n shellmind-vision
          bash -n install.sh
          bash -n lib/mac_helper.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify desktop-vision-rs Rust Crate & Unit Tests
        shell: bash
        run: |
          cd src/desktop-vision-rs
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
          mkdir -p ../../bin
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp target/release/desktop-vision-rs.exe ../../bin/desktop-vision-rs.exe
          else
            cp target/release/desktop-vision-rs ../../bin/desktop-vision-rs
          fi

      - name: End-to-End MCP Stdio & SVG Smoke Test
        shell: bash
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"inspect_svg","arguments":{"file_path_or_xml":"<svg viewBox=\\"0 0 120 40\\"><defs id=\\"d1\\"/><rect x=\\"10\\" y=\\"10\\" width=\\"20\\" height=\\"10\\"/><text x=\\"10\\" y=\\"25\\">ShellMind</text></svg>"}}}\n' | node mcp-stdio.mjs | node -e "const fs=require('fs');const lines=fs.readFileSync(0,'utf8').trim().split('\n').filter(Boolean).map(JSON.parse);const byId=Object.fromEntries(lines.map(l=>[l.id,l]));if(byId[1].result.serverInfo.name!=='ShellMind Vision')process.exit(1);if(!Array.isArray(byId[2].result.tools)||byId[2].result.tools.length<27)process.exit(1);const svg=JSON.parse(byId[3].result.content[0].text);if(!svg.ok||svg.texts.length!==1||svg.elements.length!==1)process.exit(1);console.log('CI_MCP_SMOKE_OK');"
